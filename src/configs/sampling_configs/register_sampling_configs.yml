# Register-control arm: the slots were trained as pure-noise registers (t_plan == 0),
# so sampling keeps them there via the "null" trajectory. Metrics from this arm measure
# the ViT-registers effect (extra computation tokens), the null hypothesis the science
# arm must beat.
- sampling_method: sde
  num_sampling_steps: [32, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  plan_trajectory: "null"
