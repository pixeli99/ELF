# Ordered ELF: same sampler settings, the trajectory family side by side.
# Only meaningful for a model with a plan stream (num_plan_slots > 0). For a vanilla
# model the plan_* fields are ignored and all entries produce identical output.
# Each entry writes to a separate run dir (…-plan_diagonal / …-plan_planning_first_a2.0 /
# …-plan_planning_first_a0.5 / …-plan_null) so their metrics can be compared directly.
#
# The two step counts (32 / 8) give the quality-vs-NFE comparison: the path-independence
# argument says all monotone trajectories sample the same distribution in the exact limit —
# ordering can only show up as an approximation-error effect, largest at few steps.

# diagonal: t_plan == t_tok
- sampling_method: sde
  num_sampling_steps: [32, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  plan_trajectory: diagonal

# planning-first: plan leads, t_plan = min(1, 2·t_tok)
- sampling_method: sde
  num_sampling_steps: [32, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  plan_trajectory: planning_first
  plan_lead_alpha: 2.0

# LAGGING plan (falsification arm): t_plan = 0.5·t_tok — if ordering matters in the claimed
# direction this must be WORSE than diagonal; if all three tie, ordering has no effect.
- sampling_method: sde
  num_sampling_steps: [32, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  plan_trajectory: planning_first
  plan_lead_alpha: 0.5

# null: plan stays pure noise at t_plan = 0 (inference-time plan ablation on the same model)
- sampling_method: sde
  num_sampling_steps: [32, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  plan_trajectory: "null"
