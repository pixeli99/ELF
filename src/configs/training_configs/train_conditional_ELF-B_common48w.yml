# Conditional Stage-B base: instruction + variable-K thinking plan + response.
#
# The prompt shares the sequence window with the response, so max_length and
# condition_max_tokens are a pair: 1024 + 2048 guarantees a response is never
# truncated, because the package's longest response is 1006 tokens. Measured
# cost of the wider window at K~124: 1.40 s/optimizer-step and 2.6 GiB, against
# 1.03 s and 2.0 GiB at 1024.
conditional_train_manifest: data/conditional_v1/conditional_train_manifest.json
conditional_train_manifest_sha256: 200a24b6704b3f8028dec0c991e2e31b90e2e8f49c3b2012714a967189472df3
conditional_rows: 80000          # same budget as the unconditional protocol
conditional_master_seed: 42      # with conditional_rows, this IS the schedule
conditional_verify_shards: true
max_length: 2048
condition_max_tokens: 1024
encoder_model_name: t5-small
tokenizer_name: t5-small
latent_mean: 0.0
latent_std: 0.2
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
# Plan target: frozen Plan-VAE (span-anchored, generated-null dynamic budget).
# The trailing slots of x0_plan are exact zeros -- the null code. plan_mask is
# all-ones: plan length is generated at inference, never an input.
plan_source: span_vae
plan_resampler: frozen_pool
plan_vae_artifact: artifacts/plan_vae/plan_vae_v7_beta0.1.pt
plan_vae_artifact_sha256: d2acbaa49f7db8612b16f0ca31e5b4abc926d118ded0437b9fecad99330cbbfd
plan_target_dim: 128
num_plan_slots: 64
max_plan_slots: 64
num_plan_time_tokens: 4
plan_loss_weight: 1.0
plan_time_schedule: uniform
plan_done_frac: 0.15
plan_diag_frac: 0.0
plan_whiten: external
plan_whiten_batches: 0
plan_register_only: false
plan_response_attention: bidirectional
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: logit_normal
decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
self_cond_prob: 0.5
# Backbone warm start: the public ELF-B-owt release (HF embedded-language-flows/ELF-B-owt-torch,
# checkpoint_95085, EMA params). Our own 5.5B-token dolma3 pretrain (outputs/elf_b_dolma_vanilla_5b)
# was ~8x short of that budget and its denoiser collapsed to the mean at sampling time; see
# memory / experiment notes 2026-08-29. The 1024 -> 2048 window is plain RoPE extrapolation that
# the Stage-B fine-tune adapts to, identically for all four groups.
init_from: outputs/reference_elf_b_owt/checkpoint_95085
resume: null
epochs: 1
max_optimizer_steps: 10000
global_batch_size: 1
grad_accum_steps: 8
# Optimizer. The handoff config carried warmup_optimizer_steps: 9508 (95% of the 10k-step run
# spent warming up) on top of blr's linear batch scaling (0.001 * 8/256 = 3e-5): the v2 run
# never left warmup and the freshly initialised plan head learned nothing (generated budget
# stayed 0). lr is therefore set explicitly (chosen by the 2026-08-29 three-way pilot on the
# first 8000 schedule rows), with a short warmup and cosine decay over the 10k optimizer steps.
lr: 1.0e-3
blr: 0.001                       # unused when lr is explicit; kept for the batch-scaling fallback
weight_decay: 0.0
warmup_epochs: null
warmup_steps: -1
warmup_optimizer_steps: 300
optimizer: muon
ema_decay1: 0.999                # 0.9999 has a ~7k-step half-life; too slow for a 10k-step fine-tune
gradient_checkpointing: true
use_compile: false
lr_schedule: cosine
min_lr: 0.0
sampling_configs_path: null
online_eval: false
log_freq: 10
save_freq: 0
save_optimizer_steps: [1000, 2000, 5000, 10000]
eval_freq: 0
output_dir: outputs/elf_b_conditional_common48w_ordered_10k_v3
hf_repo_id: null
use_wandb: false
seed: 42
num_workers: 2
use_bf16: true
