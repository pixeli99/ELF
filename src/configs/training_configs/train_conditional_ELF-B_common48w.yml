conditional_train_manifest_sha256: 200a24b6704b3f8028dec0c991e2e31b90e2e8f49c3b2012714a967189472df3
conditional_rows: 80000          # same budget as the unconditional protocol
conditional_master_seed: 42      # with conditional_rows, this IS the schedule
conditional_verify_shards: true
max_length: 2048
condition_max_tokens: 1024
encoder_model_name: t5-small
tokenizer_name: t5-small
