# Floor check base: can this scale do the task at all, with and without reasoning?
# Data is the paired math package: prompt / reasoning / short answer.
paired_math_dir: data/paired_math_v1
paired_math_target: answer     # overlays switch this to cot_answer
max_length: 512                # prompt + answer fits 512 for 99.7% of rows
condition_max_tokens: 384
pad_token: eos                 # the EOS tail is what teaches the model to stop
eos_tail_loss_tokens: 64

encoder_model_name: t5-small
tokenizer_name: t5-small
latent_mean: 0.0
latent_std: 0.2
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# no plan stream in the floor check: these arms only establish whether the task is
# learnable and how much explicit reasoning is worth
group_mode: vanilla
num_plan_slots: 0
max_plan_slots: 0
plan_target_dim: 0
plan_whiten: none
plan_source: frozen_pool
plan_register_only: false
plan_done_frac: 0.0
plan_diag_frac: 0.0
plan_loss_weight: 0.0

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: logit_normal
decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
self_cond_prob: 0.5

init_from: outputs/reference_elf_b_owt/checkpoint_95085
resume: null
epochs: 8
max_optimizer_steps: 12000
global_batch_size: 128
grad_accum_steps: 1
lr: 1.0e-3
blr: 0.001
weight_decay: 0.0
warmup_epochs: null
warmup_steps: -1
warmup_optimizer_steps: 400
optimizer: muon
ema_decay1: 0.999
lr_schedule: cosine
min_lr: 0.0
gradient_checkpointing: false
use_compile: false
use_bf16: true

sampling_configs_path: null
online_eval: false
log_freq: 20
save_freq: 0
save_optimizer_steps: [2000, 6000, 12000]
eval_freq: 0
output_dir: outputs/paired_math/base
hf_repo_id: null
use_wandb: false
seed: 42
num_workers: 4
