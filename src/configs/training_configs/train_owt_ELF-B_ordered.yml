# Ordered ELF (planning-first) on OpenWebText, ELF-B — PyTorch. SCIENCE ARM.
# Identical to train_owt_ELF-B.yml except the planning stream is enabled.
#
# Baseline ladder (README《Ordered ELF》一节有完整中文说明; each rung is this file plus the
# listed field diffs):
#   rung 0 vanilla ELF:            num_plan_slots: 0                     (train_owt_ELF-B.yml)
#   rung 1 register control:       plan_register_only: true              (train_owt_ELF-B_register.yml)
#   rung 2 diagonal specialist:    plan_diag_frac: 1.0, plan_done_frac: 0.0
#   rung 3 science arm (this):     conditional-uniform t_plan + atom, diag 0
#   rung 4 systems arm:            plan_time_schedule: logit_normal (+可选上三角偏置, 另训另报)
#   ours w/o plan loss:            plan_loss_weight: 0.0  (注意: 这不是 register 控制 —
#                                  输入仍会泄漏池化目标; register 用 rung 1)

# Dataset
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024

# Encoder
encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

# Model architecture
model: ELF-B  # ELF-B, ELF-M
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Planning stream (Ordered ELF)
num_plan_slots: 16
num_plan_time_tokens: 4
plan_resampler: frozen_pool
plan_loss_weight: 1.0
# Plan clock: conditional-uniform + atom at t_plan=1 (science arm).
# t_plan | t ~ U[0,1] makes the training density along ANY monotone trajectory equal to
# f(t)*1 — diagonal / leading / lagging inference paths are covered equally, so trajectory
# comparisons carry no coverage confound. The atom covers the dwell segment of saturating
# lead trajectories (half of the planning-first NFEs sit exactly at t_plan = 1).
plan_time_schedule: uniform
plan_done_frac: 0.15
plan_diag_frac: 0.0
# Whitening baked into the frozen target maker (raw pooled target is ~2x too small vs the
# token latents; measured std 0.47 / info-part 0.28 vs 0.84 on real t5-small latents).
# "pca" additionally projects each slot to plan_target_dim whitened components.
plan_whiten: zscore
plan_target_dim: 128   # only used when plan_whiten: pca
plan_whiten_batches: 64
plan_register_only: false

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
self_cond_prob: 0.5

# Training (optimizer + schedule)
epochs: 5
global_batch_size: 512
blr: 0.001
weight_decay: 0.0
warmup_epochs: 0.5
warmup_steps: -1  # -1 falls back to warmup_epochs
optimizer: muon  # "adamw" or "muon"

# EMA
ema_decay1: 0.9999

# Sampling — evaluates diagonal vs planning-first vs lagging (falsification) side by side
sampling_configs_path: "src/configs/sampling_configs/ordered_sampling_configs.yml"
num_samples: 1000

# Logging & Checkpointing
log_freq: 100
save_freq: 1
eval_freq: 1

# Output
output_dir: "outputs/elf_b-owt-ordered"
hf_repo_id: null
resume: null

# Wandb
use_wandb: true
wandb_project: elf
wandb_entity: null
wandb_run_name: elf_b-owt-ordered

# Misc
seed: 42
