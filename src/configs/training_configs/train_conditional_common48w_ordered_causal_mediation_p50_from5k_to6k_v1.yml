# Exploratory continuation from the matched prompt-causal Ordered 5k checkpoint.
# Half of training rows block the direct prompt -> response/shared attention path;
# prompt information remains available to response generation through plan slots.
# This is a validation-screening branch, not part of the preregistered 10k table.
base_config: train_conditional_common48w_ordered_causal_10k_v1.yml
output_dir: outputs/elf_b_conditional_common48w_ordered_causal_mediation_p50_from5k_to6k_v1
init_from: null
resume: outputs/elf_b_conditional_common48w_ordered_causal_10k_v1/checkpoint_5000
plan_mediation_prob: 0.5
max_optimizer_steps: 6000
save_optimizer_steps: [6000]
