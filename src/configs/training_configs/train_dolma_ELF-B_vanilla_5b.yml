# Vanilla ELF-B backbone pretrained on the Dolma 3 150B mix (streaming).
# Replaces the colleague's OWT checkpoint as the warm start for all four
# conditional Stage-B groups: same recipe as train_owt_ELF-B.yml, no plan
# machinery, so every group starts from an identical plan-free backbone.
#
# Budget: 12000 optimizer steps x 512 effective batch x ~900 valid tokens
# ~ 5.5B tokens. Epoch arithmetic: 256000 samples/"epoch" / 64 micro-batch
# = 4000 micro-steps = 500 optimizer steps per epoch; 24 epochs = 12000.
dolma_data_dir: /jfs/auto.prod.sz/data/ann/vlf/data/pengxiang.li/dolma3_mix_150b/data
dolma_min_tokens: 64
dolma_samples_per_epoch: 256000
max_length: 1024
encoder_model_name: t5-small
tokenizer_name: t5-small
latent_mean: 0.0
latent_std: 0.2
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
num_plan_slots: 0
max_plan_slots: 0
plan_whiten: none
group_mode: vanilla
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: logit_normal
decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
self_cond_prob: 0.5
init_from: null
resume: null
epochs: 24
max_optimizer_steps: 12000
global_batch_size: 64
grad_accum_steps: 8
blr: 0.001
weight_decay: 0.0
warmup_epochs: null
warmup_steps: -1
warmup_optimizer_steps: 600
optimizer: muon
ema_decay1: 0.9999
gradient_checkpointing: false
use_compile: false
lr_schedule: cosine
min_lr: 0.0
sampling_configs_path: null
online_eval: false
log_freq: 50
save_freq: 0
save_optimizer_steps: [500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000]
eval_freq: 0
output_dir: outputs/elf_b_dolma_vanilla_5b
hf_repo_id: null
use_wandb: false
seed: 42
num_workers: 4
use_bf16: true
